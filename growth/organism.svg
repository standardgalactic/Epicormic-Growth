<path d="M500.000 940.000 L498.548 930.480" stroke="hsl(108 42% 32%)" stroke-width="7.603" data-shoot="2"/>
<path d="M494.591 923.254 L485.237 916.016" stroke="hsl(129 39% 53%)" stroke-width="7.427" data-shoot="3"/>
<path d="M498.548 930.480 L502.606 920.794" stroke="hsl(125 41% 32%)" stroke-width="7.235" data-shoot="4"/>
</g>
<text x="24" y="40" font-family="monospace" font-size="18" fill="#382a1e">shoots: 00004</text>
